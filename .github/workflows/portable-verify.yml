# Runtime verification of the portable zip on a Windows runner (docs/specs/M3-design.md).
#
# Two ways in:
#   - workflow_call from portable-build.yml: the zip artifact is in the same run.
#   - workflow_dispatch with a build run id: downloads the zip of an earlier build run, so the
#     verification scripts can be iterated without rebuilding (a release build takes hours, this
#     takes minutes).
name: portable-verify

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the zip artifact (warp-portable-x64-<version>)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Id of the portable-build run that produced the zip artifact
        type: string
        required: true
      artifact_name:
        description: Name of the zip artifact in that run (warp-portable-x64-<version>)
        type: string
        required: true

# actions: read is needed to download an artifact of another run.
permissions:
  actions: read
  contents: read

concurrency:
  group: portable-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enable long paths for git
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: false
          persist-credentials: false

      # In a reusable workflow github.event_name is the CALLER's event, so it cannot tell the two
      # entry points apart. build_run_id is only ever set by workflow_dispatch of this workflow.
      - name: Download the zip (same run)
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}\portable-zip

      - name: Download the zip (earlier build run)
        if: ${{ inputs.build_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}\portable-zip
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Locate the zip
        id: zip
        shell: pwsh
        env:
          ZIP_DIR: ${{ runner.temp }}\portable-zip
        run: |
          $zips = @(Get-ChildItem -LiteralPath $env:ZIP_DIR -Recurse -File -Filter 'warp-portable-x64-*.zip')
          if ($zips.Count -ne 1) {
            Get-ChildItem -LiteralPath $env:ZIP_DIR -Recurse | Format-Table FullName, Length
            throw "Expected exactly one warp-portable-x64-*.zip, found $($zips.Count)"
          }
          Write-Output "Zip: $($zips[0].FullName) ($([math]::Round($zips[0].Length / 1MB, 1)) MB)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip_path=$($zips[0].FullName)"

      - name: Run the runtime verification
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: >-
          ./script/windows/portable/verify_runtime.ps1
          -ZipPath $env:ZIP_PATH
          -WorkRoot (Join-Path $env:RUNNER_TEMP 'Portable Test')
          -ReportDir dist/portable/runtime

      - name: Publish the report in the job summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $report = 'dist/portable/runtime/runtime-report.md'
          if (Test-Path -LiteralPath $report) {
            Get-Content -LiteralPath $report -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No runtime report was produced.'
          }

      - name: Upload the runtime report, screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-report-${{ github.run_number }}
          path: dist/portable/runtime/**
          if-no-files-found: warn
